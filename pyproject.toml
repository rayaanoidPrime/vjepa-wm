[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vjepa-nav"
version = "0.1.0"
description = "Goal-conditioned latent world model (V-JEPA 2.1) + latent->pixel diffusion decoder, trained on the Grand Tour dataset (LiMo data recipe)."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy",
    "zarr>=2.16,<3",
    "Pillow",
    "huggingface_hub[hf_transfer]>=0.23",
    "timm",
    "einops",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
eval = ["lpips", "scikit-image", "pytorch-msssim"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vjepa_nav*"]
